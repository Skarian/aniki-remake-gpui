[package]
name = "aniki-remake-gpui"
version = "0.1.0"
edition = "2024"
description = "A fast standalone fullscreen launcher for a Playnite library"

[dependencies]
libloading = "0.8.9"
raw-window-handle = "0.6"
gpui = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
serde_yaml = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_HiDpi", "Win32_UI_Input_XboxController", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0

[patch.crates-io]
gpui = { path = "vendor/gpui" }


